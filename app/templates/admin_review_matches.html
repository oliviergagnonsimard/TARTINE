{% extends 'base.html' %}
{% block body %}
<h2 style="color:#fff; padding-top:20px;">Échantillon de correspondances — semaine {{ week_start }}</h2>
<table style="width:100%; color:#ccc; font-size:13px;">
  <thead>
    <tr style="color:#555; text-align:left;">
      <th style="padding:8px;">Catalogue</th>
      <th style="padding:8px;">Rabais</th>
      <th style="padding:8px;">Épicerie</th>
      <th style="padding:8px;">Rabais %</th>
    </tr>
  </thead>
  <tbody>
    {% for row in sample %}
    <tr style="border-top:0.5px solid #222;">
      <td style="padding:8px;">{{ row[0] }}</td>
      <td style="padding:8px;">{{ row[1] }}</td>
      <td style="padding:8px;">{{ row[2] }}</td>
      <td style="padding:8px;">{{ row[3] }}%</td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
